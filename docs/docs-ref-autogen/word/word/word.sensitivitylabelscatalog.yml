  - name: getAttributes()
    uid: word!Word.SensitivityLabelsCatalog#getAttributes:member(1)
    package: word!
    fullName: getAttributes()
    summary: Gets the attribute-based access control (ABAC) attributes available for sensitivity labels.
    remarks: |-
      [API set: WordApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/word/word-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-sensitivity-labels.yaml

      // Get available ABAC attributes and describe the kind of value each attribute accepts.
      const container = document.getElementById("abac-attributes");
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }
      await Word.run(async (context) => {
        const labelCatalog: Word.SensitivityLabelsCatalog = context.sensitivityLabelsCatalog;
        if (!labelCatalog) {
          console.warn("The sensitivity label catalog isn't available.");
          return;
        }

        labelCatalog.load("getLabelingCapabilities");
        await context.sync();

        const capabilities: Word.LabelingCapability[] = labelCatalog.getLabelingCapabilities;
        if (capabilities.indexOf(Word.LabelingCapability.attributeBasedAccessControlEnabled) === -1) {
          console.warn("ABAC attributes aren't enabled or available for the current user.");
          return;
        }

        const catalogAttributes: OfficeExtension.ClientResult<Word.SensitivityLabelAbacAttribute[]> =
          labelCatalog.getAttributes();
        await context.sync();

        if (catalogAttributes.value.length === 0) {
          console.log("No ABAC attributes are available in the sensitivity label catalog.");
          return;
        }

        console.log("Available ABAC attributes:");
        catalogAttributes.value.forEach((attribute: Word.SensitivityLabelAbacAttribute) => {
          let dataTypeDescription: string;
          switch (attribute.dataType) {
            case Word.SensitivityLabelAbacAttributeDataType.booleanValue:
              dataTypeDescription = "Boolean";
              break;
            case Word.SensitivityLabelAbacAttributeDataType.dateValue:
              dataTypeDescription = "Date";
              break;
            case Word.SensitivityLabelAbacAttributeDataType.numberValue:
              dataTypeDescription = "Number";
              break;
            case Word.SensitivityLabelAbacAttributeDataType.stringValue:
              dataTypeDescription = "String";
              break;
            case Word.SensitivityLabelAbacAttributeDataType.unknown:
              dataTypeDescription = "Unknown";
              break;
            default:
              dataTypeDescription = `Unrecognized (${attribute.dataType})`;
              break;
          }

          console.log(`ABAC attribute: ${attribute.displayName}`, {
            dataType: attribute.dataType,
            dataTypeDescription,
            displayOrder: attribute.displayOrder,
            isActive: attribute.isActive,
            isMultiValued: attribute.isMultiValued,
            values: attribute.values.map((attributeValue: Word.SensitivityLabelAbacAttributeValue) => ({
              displayName: attributeValue.displayName,
              displayOrder: attributeValue.displayOrder,
              id: attributeValue.id,
              isActive: attributeValue.isActive
            }))
          });
        });

        addAttributeOptions(catalogAttributes.value);
      });
      ```

    isPreview: true
    isDeprecated: false
    syntax:
      content: 'getAttributes(): OfficeExtension.ClientResult<Word.SensitivityLabelAbacAttribute[]>;'
      return:
        type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;<xref uid="word!Word.SensitivityLabelAbacAttribute:interface" />[]&gt;
        description: ''
  - name: getLabels()
    uid: word!Word.SensitivityLabelsCatalog#getLabels:member(1)
    package: word!
    fullName: getLabels()
    summary: Gets all the sensitivity labels that are enabled in Word.
    remarks: |-
      [API set: WordApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/word/word-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-sensitivity-labels.yaml

      await Word.run(async (context) => {
        const labelSelect = document.getElementById("label-id") as HTMLSelectElement;
        labelSelect.options.length = 0;
        const placeholder = document.createElement("option");
        placeholder.textContent = "Select a label";
        placeholder.value = "";
        labelSelect.add(placeholder);

        // Get the sensitivity labels that the organization published for the current user.
        const labelCatalog: Word.SensitivityLabelsCatalog = context.sensitivityLabelsCatalog;
        if (!labelCatalog) {
          console.warn("The sensitivity label catalog isn't available.");
          return;
        }

        const availableLabels: Word.SensitivityLabelDetailsCollection = labelCatalog.getLabels();
        // Load the properties for every label in the catalog.
        availableLabels.load(
          "items/color,items/id,items/isAbacAttributesRequired,items/isAbacEnabled,items/isEnabled," +
          "items/name,items/order,items/protectionType,items/siteId,items/tooltip," +
          "items/children/items/id,items/children/items/name,items/children/items/isEnabled"
        );
        await context.sync();

        if (availableLabels.items.length === 0) {
          console.log("No sensitivity labels are available for the current user.");
          return;
        }

        // Display the loaded properties for each available label.
        console.log("Available sensitivity labels:");
        availableLabels.items.forEach((labelDetails: Word.SensitivityLabelDetails) => {
          const childLabels = labelDetails.children && labelDetails.children.items.length
            ? labelDetails.children.items
                .map((childLabel: Word.SensitivityLabelDetails) => `${childLabel.name} (${childLabel.id})`)
                .join(", ")
            : "None";

          console.log(
            `\n${labelDetails.name}\n` +
              `  ID: ${labelDetails.id}\n` +
              `  Site ID: ${labelDetails.siteId}\n` +
              `  Tooltip: ${labelDetails.tooltip}\n` +
              `  Color: ${labelDetails.color}\n` +
              `  Enabled: ${labelDetails.isEnabled ? "Yes" : "No"}\n` +
              `  Display order: ${labelDetails.order}\n` +
              `  ABAC enabled: ${labelDetails.isAbacEnabled ? "Yes" : "No"}\n` +
              `  ABAC attributes required: ${labelDetails.isAbacAttributesRequired ? "Yes" : "No"}\n` +
              `  Sublabels: ${childLabels}\n` +
              `  Protection type: ${labelDetails.protectionType}`
          );
        });

        addLabelOptions(availableLabels);
      });
      ```

    isPreview: true
    isDeprecated: false
    syntax:
      content: 'getLabels(): Word.SensitivityLabelDetailsCollection;'
      return:
        type: <xref uid="word!Word.SensitivityLabelDetailsCollection:class" />
        description: ''
