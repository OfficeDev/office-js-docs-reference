### YamlMime:TSEnum
name: Word.SaveConfiguration
uid: word!Word.SaveConfiguration:enum
package: word!
fullName: Word.SaveConfiguration
summary: Specifies the save options.
remarks: |-
  [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.WindowCloseOptions](/javascript/api/word/word.windowcloseoptions): [saveChanges](/javascript/api/word/word.windowcloseoptions#word-word-windowcloseoptions-savechanges-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/50-document/close-document-window.yaml

  // Closes the active document window with Word's prompt-to-save option.
  if (!Office.context.requirements.isSetSupported("WordApiDesktop", "1.4")) {
      console.error("This sample requires WordApiDesktop 1.4 or later.");
      return;
  }

  await Word.run(async (context) => {
      const window: Word.Window = context.document.activeWindow;
      const saveChanges: Word.SaveConfiguration = Word.SaveConfiguration.promptToSaveChanges;
      const closeOptions: Word.WindowCloseOptions = { saveChanges };
      console.log("About to close the document window...");
      window.close(closeOptions);
      await context.sync();
  });
  ```

