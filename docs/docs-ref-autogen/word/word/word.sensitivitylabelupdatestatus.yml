name: Word.SensitivityLabelUpdateStatus
uid: word!Word.SensitivityLabelUpdateStatus:enum
package: word!
fullName: Word.SensitivityLabelUpdateStatus
summary: Represents the outcome status of an attempt to update the sensitivity label on the document.
remarks: |-
  [API set: WordApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.SensitivityLabelUpdateResult](/javascript/api/word/word.sensitivitylabelupdateresult): [status](/javascript/api/word/word.sensitivitylabelupdateresult#word-word-sensitivitylabelupdateresult-status-member)

