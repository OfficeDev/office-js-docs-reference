### YamlMime:TSType
name: Word.Bookmark
uid: word!Word.Bookmark:class
package: word!
fullName: Word.Bookmark
summary: Represents a single bookmark in a document, selection, or range. The `Bookmark` object is a member of the `Bookmark` collection. The [Word.BookmarkCollection](xref:word!Word.BookmarkCollection:class) includes all the bookmarks listed in the **Bookmark** dialog box (**Insert** menu).
remarks: |-
  [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.BookmarkCollection](/javascript/api/word/word.bookmarkcollection): [add](/javascript/api/word/word.bookmarkcollection#word-word-bookmarkcollection-add-member(1)), [getItem](/javascript/api/word/word.bookmarkcollection#word-word-bookmarkcollection-getitem-member(1)), [items](/javascript/api/word/word.bookmarkcollection#word-word-bookmarkcollection-items-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/35-ranges/manage-range-bookmarks.yaml

  // Read bookmark properties and the text enclosed by each bookmark.
  await Word.run(async (context) => {
      const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
      const bookmarks: Word.BookmarkCollection = paragraphRange.bookmarks;
      bookmarks.load("items/name,items/start,items/end,items/isEmpty,items/isColumn,items/storyType,items/range/text");
      await context.sync();
      console.log(`Bookmarks found: ${bookmarks.items.length}`);
      bookmarks.items.forEach((bookmark: Word.Bookmark) => {
          console.log("Bookmark details:", {
              name: bookmark.name,
              start: bookmark.start,
              end: bookmark.end,
              isEmpty: bookmark.isEmpty,
              isColumn: bookmark.isColumn,
              storyType: bookmark.storyType,
              text: bookmark.range.text
          });
      });
  });
  ```

