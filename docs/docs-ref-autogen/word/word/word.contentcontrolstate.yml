name: Word.ContentControlState
uid: word!Word.ContentControlState:enum
package: word!
fullName: Word.ContentControlState
summary: Represents the state of the content control.
remarks: |-
  [API set: WordApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.ContentControl](/javascript/api/word/word.contentcontrol): [setState](/javascript/api/word/word.contentcontrol#word-word-contentcontrol-setstate-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/insert-and-change-content-controls.yaml

  // Marks the sample content control with a warning.
  await Word.run(async (context) => {
      const sampleControl: Word.ContentControl = context.document.contentControls
          .getByTag("ContentControlStateSample").getFirstOrNullObject();
      await context.sync();

      if (sampleControl.isNullObject) {
          console.warn("Run Set up to create the sample content control.");
          return;
      }

      const state: Word.ContentControlState = Word.ContentControlState.warning;
      sampleControl.setState(state);
      await context.sync();
      console.log(`Set sample content control state to ${state}.`);
  });
  ```

