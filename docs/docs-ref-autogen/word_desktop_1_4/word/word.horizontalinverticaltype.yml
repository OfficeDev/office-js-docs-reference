### YamlMime:TSEnum
name: Word.HorizontalInVerticalType
uid: word!Word.HorizontalInVerticalType:enum
package: word!
fullName: Word.HorizontalInVerticalType
summary: Specifies the format for horizontal text set within vertical text.
remarks: |-
  [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.Range](/javascript/api/word/word.range): [horizontalInVertical](/javascript/api/word/word.range#word-word-range-horizontalinvertical-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/28-formatting/apply-character-layout-desktop.yaml

  // Keeps the first paragraph's characters horizontal within vertical text.
  await Word.run(async (context) => {
      const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
      const horizontalLayout: Word.HorizontalInVerticalType = Word.HorizontalInVerticalType.fitInLine;
      paragraphRange.horizontalInVertical = horizontalLayout;
      await context.sync();
      console.log("Enabled horizontal-in-vertical layout on the first paragraph. Get layout settings to verify it.");
  });
  ```

isPreview: false
isDeprecated: false
