  - name: movedRange
    uid: word!Word.Revision#movedRange:member
    package: word!
    fullName: movedRange
    summary: Gets a `Range` object that represents the range of text that was moved from one place to another in the document with tracked changes.
    remarks: |-
      [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/50-document/track-moved-text.yaml

      // Reads and selects the text associated with a tracked move.
      await Word.run(async (context) => {
          const document: Word.Document = context.document;
          const revisions: Word.RevisionCollection = document.revisions;
          revisions.load("items/type");
          await context.sync();

          const movedFrom: Word.RevisionType = Word.RevisionType.movedFrom;
          const movedTo: Word.RevisionType = Word.RevisionType.movedTo;
          const movedRevision: Word.Revision | undefined = revisions.items.find(
              (revision: Word.Revision) => revision.type === movedFrom || revision.type === movedTo
          );
          if (!movedRevision) {
              console.log("Revision types found:", revisions.items.map((revision: Word.Revision) => revision.type));
              console.warn("No tracked move was found. Move an entire paragraph as described in the task pane; moving a phrase may produce insertion and deletion revisions instead.");
              return;
          }

          const movedRange: Word.Range = movedRevision.movedRange;
          movedRange.load("text");
          movedRange.select();
          await context.sync();

          console.log(`Moved revision range text: ${movedRange.text}`);
      });
      ```

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'readonly movedRange: Word.Range;'
      return:
        type: <xref uid="word!Word.Range:class" />
  - name: range
    uid: word!Word.Revision#range:member
    package: word!
    fullName: range
    summary: Gets a `Range` object that represents the portion of the document that's contained within a revision mark.
    remarks: |-
      [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/50-document/manage-tracked-changes.yaml

      // Reads and selects the text affected by the first revision.
      await Word.run(async (context) => {
          const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
          const revisions: Word.RevisionCollection = paragraphRange.revisions;
          revisions.load("items");
          await context.sync();

          if (revisions.items.length === 0) {
              console.warn("No revisions were found. Run Set up to create tracked changes.");
              return;
          }

          const firstRevision: Word.Revision = revisions.items[0];
          const revisionRange: Word.Range = firstRevision.range;
          revisionRange.load("text");
          revisionRange.select();
          await context.sync();

          console.log(`First revision range text: ${revisionRange.text}`);
      });
      ```

    isPreview: false
    isDeprecated: false
    syntax:
