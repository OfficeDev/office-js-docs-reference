### YamlMime:TSType
name: Word.Revision
uid: word!Word.Revision:class
package: word!
fullName: Word.Revision
summary: Represents a single tracked change in a document.
remarks: |-
  [API set: WordApiDesktop 1.4](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.RevisionCollection](/javascript/api/word/word.revisioncollection): [items](/javascript/api/word/word.revisioncollection#word-word-revisioncollection-items-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/50-document/manage-tracked-changes.yaml

  // Reads revision metadata for the first paragraph on desktop Word.
  await Word.run(async (context) => {
      const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
      const revisions: Word.RevisionCollection = paragraphRange.revisions;
      revisions.load("items/author,items/date,items/type,items/index,items/formatDescription");
      await context.sync();
      console.log(`Revisions in the first paragraph: ${revisions.items.length}`);
      revisions.items.forEach((revision: Word.Revision) => {
          console.log("Revision properties:", {
              author: revision.author,
              date: revision.date,
              type: revision.type,
              index: revision.index,
              formatDescription: revision.formatDescription,
          });
      });
  });
  ```

