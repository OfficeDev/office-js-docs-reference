### YamlMime:TSEnum
name: Excel.LinkedEntityDataDomainRefreshMode
uid: excel!Excel.LinkedEntityDataDomainRefreshMode:enum
package: excel!
fullName: Excel.LinkedEntityDataDomainRefreshMode
summary: Represents the refresh mode setting for the `LinkedEntityCellValue` objects of a `LinkedEntityDataDomain`<!-- -->.
remarks: |-
  [API set: ExcelApi 1.19](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

  #### Used by

  - [Excel.LinkedEntityDataDomain](/javascript/api/excel/excel.linkedentitydatadomain): [refreshMode](/javascript/api/excel/excel.linkedentitydatadomain#excel-excel-linkedentitydatadomain-refreshmode-member), [supportedRefreshModes](/javascript/api/excel/excel.linkedentitydatadomain#excel-excel-linkedentitydatadomain-supportedrefreshmodes-member)
  - [Excel.LinkedEntityDataDomainCreateOptions](/javascript/api/excel/excel.linkedentitydatadomaincreateoptions): [supportedRefreshModes](/javascript/api/excel/excel.linkedentitydatadomaincreateoptions#excel-excel-linkedentitydatadomaincreateoptions-supportedrefreshmodes-member)
  - [Excel.LinkedEntityDataDomainRefreshModeChangedEventArgs](/javascript/api/excel/excel.linkedentitydatadomainrefreshmodechangedeventargs): [refreshMode](/javascript/api/excel/excel.linkedentitydatadomainrefreshmodechangedeventargs#excel-excel-linkedentitydatadomainrefreshmodechangedeventargs-refreshmode-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/20-data-types/data-types-linked-entities.yaml

  // Register the product, category, and supplier data sources with Excel.
  await Excel.run(async (context) => {
      const domains: Excel.LinkedEntityDataDomainCollection = context.workbook.linkedEntityDataDomains;
      const refreshModes: Excel.LinkedEntityDataDomainRefreshMode[] = [
          Excel.LinkedEntityDataDomainRefreshMode.manual,
          Excel.LinkedEntityDataDomainRefreshMode.onLoad,
          Excel.LinkedEntityDataDomainRefreshMode.periodic
      ];
      // Script Lab prefixes the function ID with the companion sample's name, without spaces.
      const loadFunctionId = "LINKEDENTITYLOADSERVICE.CONTOSOLOADSERVICE";
      const options: Excel.LinkedEntityDataDomainCreateOptions[] = [
          {
              dataProvider: "Contoso",
              id: "products",
              name: "Products",
              loadFunctionId,
              periodicRefreshInterval: 300,
              supportedRefreshModes: refreshModes
          },
          {
              dataProvider: "Contoso",
              id: "categories",
              name: "Categories",
              loadFunctionId,
              periodicRefreshInterval: 300,
              supportedRefreshModes: refreshModes
          },
          {
              dataProvider: "Contoso",
              id: "suppliers",
              name: "Suppliers",
              loadFunctionId
          }
      ];

      // Replace only this sample's domains so registration is repeatable.
      const existingDomains: Excel.LinkedEntityDataDomain[] = options.map((options) =>
          domains.getItemOrNullObject(options.id)
      );
      await context.sync();
      existingDomains.forEach((domain) => {
          if (!domain.isNullObject) {
              domain.delete();
          }
      });
      options.forEach((options) => domains.add(options));
      await context.sync();
      console.log("Registered Products, Categories, and Suppliers. Manual refresh is the default.");
  });
  ```

isPreview: false
isDeprecated: false
fields:
  - name: manual
    uid: excel!Excel.LinkedEntityDataDomainRefreshMode.manual:member
    package: excel!
    summary: |-
      Manual refresh by the user. Refresh is not triggered automatically.

      * [API set: ExcelApi 1.19](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
    value: '"Manual"'
  - name: onLoad
    uid: excel!Excel.LinkedEntityDataDomainRefreshMode.onLoad:member
    package: excel!
    summary: |-
      Refresh on workbook load, applicable to linked entity data domains defined by service data providers, such as Bing or Power BI. Refresh on add-in load, applicable to linked entity data domains defined by Office Add-ins.

      * [API set: ExcelApi 1.19](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
    value: '"OnLoad"'
  - name: periodic
    uid: excel!Excel.LinkedEntityDataDomainRefreshMode.periodic:member
    package: excel!
    summary: |-
      Refresh automatically based on the frequency, in seconds, specified by `periodicRefreshInterval`<!-- -->. For linked entity data domains defined by service data providers, such as Bing or Power BI, this value also initiates a refresh each time the workbook is opened. For linked entity data domains defined by Office Add-ins, this value also initiates a refresh each time the add-in loads.

      * [API set: ExcelApi 1.19](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
    value: '"Periodic"'
  - name: unknown
    uid: excel!Excel.LinkedEntityDataDomainRefreshMode.unknown:member
    package: excel!
    summary: |-
      Refresh mode is unknown or unsupported.

      * [API set: ExcelApi 1.19](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
    value: '"Unknown"'
