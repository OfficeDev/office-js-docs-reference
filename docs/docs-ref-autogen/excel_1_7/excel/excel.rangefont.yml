### YamlMime:TSType
name: Excel.RangeFont
uid: excel!Excel.RangeFont:class
package: excel!
fullName: Excel.RangeFont
summary: This object represents the font attributes (font name, font size, color, etc.) for an object.
remarks: |-
  [API set: ExcelApi 1.1](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

  #### Used by

  - [Excel.RangeFormat](/javascript/api/excel/excel.rangeformat): [font](/javascript/api/excel/excel.rangeformat#excel-excel-rangeformat-font-member)
  - [Excel.Style](/javascript/api/excel/excel.style): [font](/javascript/api/excel/excel.style#excel-excel-style-font-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/formatting.yaml

  // Set several font properties for the header range.
  await Excel.run(async (context) => {
      const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
      const headerRange: Excel.Range = sheet.getRange("B2:E2");
      const headerFont: Excel.RangeFont = headerRange.format.font;

      headerFont.set({
          bold: true,
          color: "#1F4E78",
          italic: false,
          name: "Aptos Display",
          size: 14,
          underline: Excel.RangeUnderlineStyle.single
      });

      await context.sync();
      console.log("The header font formatting was updated.");
  });
  ```

