properties:
  - name: bold
    uid: excel!Excel.RangeFont#bold:member
    package: excel!
    fullName: bold
    summary: Represents the bold status of the font.
    remarks: |-
      [API set: ExcelApi 1.1](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/range-auto-fill.yaml

      await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getActiveWorksheet();
        const sumRange = sheet.getRange("F4");
        sumRange.formulas = [["=SUM(B4:E4)"]];
        sumRange.format.fill.color = "LightBlue";
        sumRange.format.font.bold = true;
        sheet.getRanges("K4,P4").copyFrom("F4", Excel.RangeCopyType.all);
        sheet.getRanges("F4,K4,P4").format.autofitColumns();
        await context.sync();
      });
      ```

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'bold: boolean;'
      return:
        type: boolean
  - name: color
    uid: excel!Excel.RangeFont#color:member
    package: excel!
    fullName: color
    summary: HTML color code representation of the text color (e.g., \#FF0000 represents Red).
    remarks: |-
      [API set: ExcelApi 1.1](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/formatting.yaml

      // Get the font properties for the header range.
      await Excel.run(async (context) => {
          const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
          const headerRange: Excel.Range = sheet.getRange("B2:E2");
          const headerFont: Excel.RangeFont = headerRange.format.font;

          headerFont.load("bold, color, italic, name, size, underline");
          await context.sync();

          console.log(`Bold: ${headerFont.bold}`);
          console.log(`Color: ${headerFont.color}`);
          console.log(`Italic: ${headerFont.italic}`);
          console.log(`Name: ${headerFont.name}`);
          console.log(`Size: ${headerFont.size}`);
          console.log(`Underline: ${headerFont.underline}`);
      });
      ```

    isPreview: false
    isDeprecated: false
    syntax:
