### YamlMime:TSType
name: Excel.ChangedEventDetail
uid: excel!Excel.ChangedEventDetail:interface
package: excel!
fullName: Excel.ChangedEventDetail
summary: Provides information about the details of a `WorksheetChangedEvent` or `TableChangedEvent`<!-- -->.
remarks: |-
  [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

  #### Used by

  - [Excel.TableChangedEventArgs](/javascript/api/excel/excel.tablechangedeventargs): [details](/javascript/api/excel/excel.tablechangedeventargs#excel-excel-tablechangedeventargs-details-member)
  - [Excel.WorksheetChangedEventArgs](/javascript/api/excel/excel.worksheetchangedeventargs): [details](/javascript/api/excel/excel.worksheetchangedeventargs#excel-excel-worksheetchangedeventargs-details-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/data-change-event-details.yaml

  async function onTableChanged(eventArgs: Excel.TableChangedEventArgs) {
      // Inspect the values and basic types of an edited table cell, and identify errors.
      await Excel.run(async (context) => {
          const details: Excel.ChangedEventDetail = eventArgs.details;
          const address = eventArgs.address;
          if (!details) {
              console.log("Edit one table cell at a time to inspect its value and type.");
              return;
          }

          console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
            + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);

          const errorType: Excel.RangeValueType = Excel.RangeValueType.error;
          if (details.valueTypeAfter === errorType) {
              console.log("The updated cell contains an error:", details.valueAfter);
          }
      });
  }
  ```

