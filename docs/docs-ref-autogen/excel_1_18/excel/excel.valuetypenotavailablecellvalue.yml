### YamlMime:TSType
name: Excel.ValueTypeNotAvailableCellValue
uid: excel!Excel.ValueTypeNotAvailableCellValue:interface
package: excel!
fullName: Excel.ValueTypeNotAvailableCellValue
summary: Represents the value of a cell containing a type of value which cannot be serialized. For example, an \#UNKNOWN! error which represents a type of rich value not known to this version of Excel.
remarks: |-
  [API set: ExcelApi 1.16](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/20-data-types/data-types-error-values.yaml

  // Read the fallback properties of a value that Excel can't serialize.
  await Excel.run(async (context) => {
    const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
    const range: Excel.Range = sheet.getRange("B1");
    range.load("valuesAsJson");
    await context.sync();

    const cellValue: Excel.CellValue = range.valuesAsJson[0][0];
    if (cellValue.type === Excel.CellValueType.notAvailable) {
      const unavailableValue: Excel.ValueTypeNotAvailableCellValue = cellValue;
      console.log("B1 value type:", unavailableValue.type);
      console.log("B1 fallback type:", unavailableValue.basicType);
      console.log("B1 fallback value:", unavailableValue.basicValue);
    } else {
      console.log("B1 value type:", cellValue.type);
      console.log("B1's value type is supported. No unavailable-type fallback was returned.");
    }
  });
  ```

