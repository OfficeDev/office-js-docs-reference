methods:
  - name: add(object)
    uid: office!OfficeExtension.TrackedObjects#add:member(1)
    package: office!
    fullName: add(object)
    summary: Track a new object for automatic adjustment based on surrounding changes in the document. Only some object types require this. If you are using an object across ".sync" calls and outside the sequential execution of a ".run" batch, and get an "InvalidObjectPath" error when setting a property or invoking a method on the object, you needed to have added the object to the tracked object collection when the object was first created. If this object is part of a collection in Word, you should also track the parent collection.
    remarks: ''

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'add(object: ClientObject): void;'
      parameters:
        - id: object
          description: ''
          type: <xref uid="office!OfficeExtension.ClientObject:class" />
      return:
        type: void
        description: |-


          #### Examples

          ```TypeScript
          // This sample shows how to track a Word proxy object so it can be used
          // across multiple context.sync() calls.
          await Word.run(async (context) => {
              // Create a paragraph proxy object.
              const paragraph = context.document.body.insertParagraph(
                  "This paragraph is tracked across sync calls.",
                  Word.InsertLocation.end
              );

              // Track the paragraph so it remains valid across sync calls.
              context.trackedObjects.add(paragraph);
              await context.sync();

              // The tracked paragraph can still be used after the preceding sync.
              paragraph.font.bold = true;
              await context.sync();

              // Remember to release the object from memory once you're done with it.
              context.trackedObjects.remove(paragraph);
              await context.sync();
          });
          ```
  - name: add(objects)
