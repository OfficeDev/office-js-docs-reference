  - name: remove(object)
    uid: office!OfficeExtension.TrackedObjects#remove:member(1)
    package: office!
    fullName: remove(object)
    summary: If the given proxy object is already in this collection, this method releases the memory associated with the object. You need to call `context.sync()` before the memory release takes effect. If the given proxy object isn't in this collection, the proxy object won't be stored after `context.sync()` is called. This speeds up instances where many objects are created for single-use operations.
    remarks: ''

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'remove(object: ClientObject): void;'
      parameters:
        - id: object
          description: ''
          type: <xref uid="office!OfficeExtension.ClientObject:class" />
      return:
        type: void
        description: |-


          #### Examples

          ```TypeScript
          // This sample inserts many paragraphs into a Word document, removing each
          // paragraph proxy object from memory after it's used.
          await Word.run(async (context) => {
              const body = context.document.body;

              for (let i = 0; i < 500; i++) {
                  const paragraph = body.insertParagraph(`Paragraph ${i}`, Word.InsertLocation.end);

                  // Release the paragraph proxy object from memory now that we're
                  // done with it. The memory is freed on the next context.sync() call.
                  context.trackedObjects.remove(paragraph);
              }

              await context.sync();
          });
          ```
