### YamlMime:TSType
name: OfficeExtension.TrackedObjects
uid: office!OfficeExtension.TrackedObjects:class
package: office!
fullName: OfficeExtension.TrackedObjects
summary: Collection of tracked objects, contained within a request context. See [context.trackedObjects](https://learn.microsoft.com/javascript/api/office/officeextension.clientrequestcontext#office-officeextension-clientrequestcontext-trackedobjects-member) for more information.
remarks: |-


  #### Used by

  - [OfficeExtension.ClientRequestContext](/javascript/api/office/officeextension.clientrequestcontext): [trackedObjects](/javascript/api/office/officeextension.clientrequestcontext#office-officeextension-clientrequestcontext-trackedobjects-member)

  #### Examples

  ```TypeScript
  // This sample creates many one-cell ranges, then removes each
  // cell proxy object from memory before the batch operation completes.
  await Excel.run(async (context) => {
      const largeRange = context.workbook.getSelectedRange();
      largeRange.load(["rowCount", "columnCount"]);
      await context.sync();

      const trackedObjects: OfficeExtension.TrackedObjects = context.trackedObjects;

      for (let i = 0; i < largeRange.rowCount; i++) {
          for (let j = 0; j < largeRange.columnCount; j++) {
              const cell = largeRange.getCell(i, j);
              cell.values = [[i *j]];

              // Release the cell proxy object from memory now that we're
              // done with it. The memory is freed on the next context.sync() call.
              trackedObjects.remove(cell);
          }
      }

      await context.sync();
  });
  ```

