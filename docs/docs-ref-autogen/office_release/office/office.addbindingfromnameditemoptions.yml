name: Office.AddBindingFromNamedItemOptions
uid: office!Office.AddBindingFromNamedItemOptions:interface
package: office!
fullName: Office.AddBindingFromNamedItemOptions
summary: Provides options for configuring the binding that is created.
remarks: |-


  #### Used by

  - [Office.Bindings](/javascript/api/office/office.bindings): [addFromNamedItemAsync](/javascript/api/office/office.bindings#office-office-bindings-addfromnameditemasync-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/03-bindings/manage-named-item-binding.yaml

  // Creates a text binding from the title of a Rich Text content control.
  const options: Office.AddBindingFromNamedItemOptions = { id: bindingId };
  Office.context.document.bindings.addFromNamedItemAsync(
      namedItemTitle,
      Office.BindingType.Text,
      options,
      (asyncResult) => {
          if (asyncResult.status === Office.AsyncResultStatus.Failed) {
              console.error(asyncResult.error.message);
              return;
          }

          console.log(`Created binding "${asyncResult.value.id}" of type "${asyncResult.value.type}".`);
      }
  );
  ```

