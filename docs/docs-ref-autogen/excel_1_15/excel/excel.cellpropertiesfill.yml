type: interface
properties:
  - name: color
    uid: excel!Excel.CellPropertiesFill#color:member
    package: excel!
    fullName: color
    summary: Represents the `format.fill.color` property.
    remarks: |-
      [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/cell-properties.yaml

      await Excel.run(async (context) => {
          const sheet = context.workbook.worksheets.getActiveWorksheet();

          // Create the SettableCellProperties objects for the range.
          // Create these objects once, outside the function, in your add-in.
          const topHeaderProps: Excel.SettableCellProperties = {
              // Set the style property to the name of an Excel style.
              // The `BuiltInStyle` enum lists the built-in style names.
              // A style overwrites formatting, so don't use style and format in the same object.
              style: Excel.BuiltInStyle.heading1
          };

          const headerProps: Excel.SettableCellProperties = {
              // Setting these cell properties doesn't change unspecified format subproperties.
              format: {
                  fill: {
                      color: "Blue"
                  },
                  font: {
                      color: "White",
                      bold: true
                  }
              }
          };

          const nonApplicableProps: Excel.SettableCellProperties = {
              format: {
                  fill: {
                      pattern: Excel.FillPattern.gray25
                  },
                  font: {
                      color: "Gray",
                      italic: true
                  }
              }
          };

          const matchupScoreProps: Excel.SettableCellProperties = {
              format: {
                  borders: {
                      bottom: {
                          style: Excel.BorderLineStyle.continuous
                      },
                      left: {
                          style: Excel.BorderLineStyle.continuous
                      },
                      right: {
                          style: Excel.BorderLineStyle.continuous
                      },
                      top: {
                          style: Excel.BorderLineStyle.continuous
                      }
                  },
                  horizontalAlignment: Excel.HorizontalAlignment.center
              }
          };

          const range = sheet.getRange("A1:E5");

          // Use empty JSON objects to leave a cell's properties unchanged.
          range.setCellProperties([
              [topHeaderProps, {}, {}, {}, {}],
              [{}, {}, headerProps, headerProps, headerProps],
              [{}, headerProps, nonApplicableProps, matchupScoreProps, matchupScoreProps],
              [{}, headerProps, matchupScoreProps, nonApplicableProps, matchupScoreProps],
              [{}, headerProps, matchupScoreProps, matchupScoreProps, nonApplicableProps]
          ]);

          sheet.getUsedRange().format.autofitColumns();
          await context.sync();
      });
      ```

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'color?: string;'
      return:
        type: string
