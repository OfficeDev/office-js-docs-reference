fullName: Excel.CellPropertiesFill
summary: Represents the `format.fill` properties of `getCellProperties`<!-- -->, `getRowProperties`<!-- -->, and `getColumnProperties` or the `format.fill` input parameter of `setCellProperties`<!-- -->, `setRowProperties`<!-- -->, and `setColumnProperties`<!-- -->.
