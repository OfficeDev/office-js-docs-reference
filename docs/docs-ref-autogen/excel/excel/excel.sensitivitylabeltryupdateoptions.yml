properties:
  - name: abacAttributes
    uid: excel!Excel.SensitivityLabelTryUpdateOptions#abacAttributes:member
    package: excel!
    fullName: abacAttributes
    summary: If provided, specifies the attribute-based access control (ABAC) attributes to apply with the label. Must be omitted or empty for labels that are not ABAC-enabled; otherwise the update result has a `status` of `SensitivityLabelUpdateStatus.abacAttributesNotAllowed`<!-- -->. Required when the target label is ABAC-enabled and `SensitivityLabelDetails.isAbacAttributesRequired` is `true`<!-- -->.
    remarks: '[API set: ExcelApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)'

    isPreview: true
