  - name: tryToUpdate(labelId, options)
    uid: excel!Excel.SensitivityLabel#tryToUpdate:member(1)
    package: excel!
    fullName: tryToUpdate(labelId, options)
    summary: Tries to update to the provided sensitivity label on the workbook for the user. For ABAC-enabled labels, pass the desired attribute selections via `options.abacAttributes`<!-- -->.
    remarks: |-
      [API set: ExcelApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/98-preview-apis/manage-sensitivity-labels.yaml

      // Apply the selected sensitivity label to the entire workbook.
      await Excel.run(async (context) => {
          const labelId = (document.getElementById("label-id") as HTMLSelectElement).value;
          if (!labelId) {
              console.warn("Get available labels and select a label first.");
              return;
          }

          const workbook: Excel.Workbook = context.workbook;
          const workbookLabel: Excel.SensitivityLabel = workbook.sensitivityLabel;
          const updateResult: OfficeExtension.ClientResult<Excel.SensitivityLabelUpdateResult> =
              workbookLabel.tryToUpdate(labelId);
          await context.sync();

          if (updateResult.value.status === Excel.SensitivityLabelUpdateStatus.success) {
              console.log("Applied the sensitivity label to the workbook.");
          } else {
              console.error(`The sensitivity label wasn't applied. Status: ${updateResult.value.status}`);
          }
      });
      ```

    isPreview: true
    isDeprecated: false
