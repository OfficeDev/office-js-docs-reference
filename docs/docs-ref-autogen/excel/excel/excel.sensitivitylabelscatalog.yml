  - name: getLabelingCapability
    uid: excel!Excel.SensitivityLabelsCatalog#getLabelingCapability:member
    package: excel!
    fullName: getLabelingCapability
    summary: Gets whether the catalog of sensitivity labels is enabled in Excel.
    remarks: |-
      [API set: ExcelApi BETA (PREVIEW ONLY)](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/98-preview-apis/manage-sensitivity-labels.yaml

      // Check whether sensitivity labeling is available for the current user.
      await Excel.run(async (context) => {
          const labelCatalog: Excel.SensitivityLabelsCatalog = context.sensitivityLabelsCatalog;
          if (!labelCatalog) {
              console.warn("The sensitivity label catalog isn't available in this version of Excel.");
              return;
          }

          labelCatalog.load("getLabelingCapability");
          await context.sync();

          switch (labelCatalog.getLabelingCapability) {
              case Excel.LabelingCapability.labelingEnabled:
                  console.log("Sensitivity labeling is enabled.");
                  break;
              case Excel.LabelingCapability.labelingDisabled:
                  console.log("Sensitivity labeling is disabled.");
                  break;
              case Excel.LabelingCapability.labelingPolicyNotFound:
                  console.log("No sensitivity labeling policy was found.");
                  break;
              case Excel.LabelingCapability.noLicense:
                  console.log("The current user doesn't have a valid sensitivity labeling license.");
                  break;
              default:
                  console.log(`Unknown labeling capability: ${labelCatalog.getLabelingCapability}`);
                  break;
          }
      });
      ```

    isPreview: true
    isDeprecated: false
