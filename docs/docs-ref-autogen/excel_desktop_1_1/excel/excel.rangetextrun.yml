### YamlMime:TSType
name: Excel.RangeTextRun
uid: excel!Excel.RangeTextRun:interface
package: excel!
fullName: Excel.RangeTextRun
summary: Represents a sequence of one or more characters that share the same font attributes in a cell. Can be used as the `textRuns` properties of `getCellProperties` or the `textRuns` input parameter of `setCellProperties`<!-- -->.
remarks: |-
  [API set: ExcelApi 1.18](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

  #### Used by

  - [Excel.SettableCellProperties](/javascript/api/excel/excel.settablecellproperties): [textRuns](/javascript/api/excel/excel.settablecellproperties#excel-excel-settablecellproperties-textruns-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/cell-properties.yaml

  await Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();

      const textRunFormats: Excel.RangeTextRun[] = [
          {
              text: "Rich ",
              font: {
                  bold: true,
                  color: "#C00000",
                  size: 14
              }
          },
          {
              text: "text",
              font: {
                  color: "#4472C4",
                  italic: true,
                  underline: Excel.RangeUnderlineStyle.single
              }
          }
      ]
      const richTextProps: Excel.SettableCellProperties = {
          textRuns: textRunFormats
      };

      sheet.getRange("A7").setCellProperties([[richTextProps]]);
      await context.sync();
  });
  ```

