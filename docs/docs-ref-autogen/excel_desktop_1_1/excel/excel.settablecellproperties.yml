### YamlMime:TSType
name: Excel.SettableCellProperties
uid: excel!Excel.SettableCellProperties:interface
package: excel!
fullName: Excel.SettableCellProperties
summary: |-
  Represents the input parameter of setCellProperties.

  [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
remarks: |-


  #### Used by

  - [Excel.Range](/javascript/api/excel/excel.range): [setCellProperties](/javascript/api/excel/excel.range#excel-excel-range-setcellproperties-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/cell-properties.yaml

  await Excel.run(async (context) => {
      const sheet = context.workbook.worksheets.getActiveWorksheet();

      const detailedFormatProps: Excel.SettableCellProperties = {
          format: {
              borders: {
                  diagonalDown: {
                      color: "#C00000",
                      style: Excel.BorderLineStyle.dash,
                      weight: Excel.BorderWeight.medium
                  }
              },
              fill: {
                  color: "#D9EAF7",
                  pattern: Excel.FillPattern.lightDown,
                  patternColor: "#4472C4"
              },
              font: {
                  bold: true,
                  color: "#1F1F1F",
                  name: "Arial",
                  size: 12
              },
              horizontalAlignment: Excel.HorizontalAlignment.center,
              protection: {
                  formulaHidden: false,
                  locked: false
              },
              textOrientation: 15,
              verticalAlignment: Excel.VerticalAlignment.center,
              wrapText: true
          }
      };

      const cell = sheet.getRange("C7");
      cell.setCellProperties([[detailedFormatProps]]);
      cell.format.rowHeight = 45;
      await context.sync();
  });
  ```

