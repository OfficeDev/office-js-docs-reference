### YamlMime:TSEnum
name: Word.InsertLocation
uid: word!Word.InsertLocation:enum
package: word!
fullName: Word.InsertLocation
summary: Represents the insertion location type.
remarks: |-
  [API set: WordApi 1.1](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  To be used with an API call, such as `obj.insertSomething(newStuff, location);`<!-- -->. If the location is `before` or `after`<!-- -->, the new content will be outside of the modified object. If the location is `start` or `end`<!-- -->, the new content will be included as part of the modified object.

  #### Used by

  - [Word.CommentContentRange](/javascript/api/word/word.commentcontentrange): [insertText](/javascript/api/word/word.commentcontentrange#word-word-commentcontentrange-inserttext-member(1))
  - [Word.Range](/javascript/api/word/word.range): [insertField](/javascript/api/word/word.range#word-word-range-insertfield-member(1)), [insertFileFromBase64](/javascript/api/word/word.range#word-word-range-insertfilefrombase64-member(1)), [insertHtml](/javascript/api/word/word.range#word-word-range-inserthtml-member(1)), [insertInlinePictureFromBase64](/javascript/api/word/word.range#word-word-range-insertinlinepicturefrombase64-member(1)), [insertOoxml](/javascript/api/word/word.range#word-word-range-insertooxml-member(1)), [insertText](/javascript/api/word/word.range#word-word-range-inserttext-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/50-document/insert-section-breaks.yaml

  // Adds a section at the current position without adding a page break.
  await Word.run(async (context) => {
    const body: Word.Body = context.document.body;
    const insertLocation: Word.InsertLocation = Word.InsertLocation.end;
    body.insertBreak(Word.BreakType.sectionContinuous, insertLocation);
    body.insertParagraph("Continuous section", insertLocation);

    await context.sync();

    console.log("Added a section without adding a page break.");
  });
  ```

