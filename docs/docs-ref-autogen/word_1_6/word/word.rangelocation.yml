### YamlMime:TSEnum
name: Word.RangeLocation
uid: word!Word.RangeLocation:enum
package: word!
fullName: Word.RangeLocation
summary: Represents the location of a range. You can get range by calling getRange on different objects such as [Word.Paragraph](xref:word!Word.Paragraph:class) and [Word.ContentControl](xref:word!Word.ContentControl:class)<!-- -->.
remarks: |-
  [API set: WordApi 1.3](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.ContentControl](/javascript/api/word/word.contentcontrol): [getRange](/javascript/api/word/word.contentcontrol#word-word-contentcontrol-getrange-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/25-paragraph/get-paragraph-on-insertion-point.yaml

  // Gets complete sentences from the insertion point to the end of its paragraph.
  await Word.run(async (context) => {
    const selection: Word.Range = context.document.getSelection();
    const sentences: Word.RangeCollection = selection.getTextRanges(["."], false);
    sentences.load("$none");
    await context.sync();

    const firstSentence: Word.Range = sentences.items[0];
    const paragraphEnd: Word.Range = selection.paragraphs.getFirst().getRange(Word.RangeLocation.end);
    const remainingRange: Word.Range = firstSentence.expandTo(paragraphEnd);
    const sentencesToTheEndOfParagraph: Word.RangeCollection = remainingRange.getTextRanges(["."], false);
    sentencesToTheEndOfParagraph.load("text");
    await context.sync();

    console.log("Sentences from the current sentence to the paragraph end:");
    for (let i = 0; i < sentencesToTheEndOfParagraph.items.length; i++) {
      console.log(sentencesToTheEndOfParagraph.items[i].text);
    }
  });
  ```

