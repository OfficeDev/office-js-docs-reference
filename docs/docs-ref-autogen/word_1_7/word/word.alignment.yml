### YamlMime:TSEnum
name: Word.Alignment
uid: word!Word.Alignment:enum
package: word!
fullName: Word.Alignment
summary: Represents the horizontal alignment of text.
remarks: |-
  [API set: WordApi 1.1](/javascript/api/requirement-sets/word/word-api-requirement-sets)

  #### Used by

  - [Word.List](/javascript/api/word/word.list): [setLevelAlignment](/javascript/api/word/word.list#word-word-list-setlevelalignment-member(1))
  - [Word.Paragraph](/javascript/api/word/word.paragraph): [alignment](/javascript/api/word/word.paragraph#word-word-paragraph-alignment-member)
  - [Word.ParagraphFormat](/javascript/api/word/word.paragraphformat): [alignment](/javascript/api/word/word.paragraphformat#word-word-paragraphformat-alignment-member)
  - [Word.Table](/javascript/api/word/word.table): [alignment](/javascript/api/word/word.table#word-word-table-alignment-member), [horizontalAlignment](/javascript/api/word/word.table#word-word-table-horizontalalignment-member)
  - [Word.TableCell](/javascript/api/word/word.tablecell): [horizontalAlignment](/javascript/api/word/word.tablecell#word-word-tablecell-horizontalalignment-member)
  - [Word.TableRow](/javascript/api/word/word.tablerow): [horizontalAlignment](/javascript/api/word/word.tablerow#word-word-tablerow-horizontalalignment-member)

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/25-paragraph/paragraph-properties.yaml

  // Centers the last paragraph between the document margins.
  await Word.run(async (context) => {
    const lastParagraph: Word.Paragraph = context.document.body.paragraphs.getLast();
    const alignment: Word.Alignment = Word.Alignment.centered;
    lastParagraph.alignment = alignment;

    await context.sync();
  });
  ```

