### YamlMime:TSType
name: Office.Control
uid: office!Office.Control:interface
package: office!
fullName: Office.Control
summary: Represents an individual control or command and the state it should have.
remarks: |-
  For code samples showing how to use a `Control` object and its properties, see [Change the availability of add-in commands](https://learn.microsoft.com/office/dev/add-ins/design/disable-add-in-commands) and [Create custom contextual tabs](https://learn.microsoft.com/office/dev/add-ins/design/contextual-tabs)<!-- -->.

  **Requirement set**: [RibbonApi 1.1](https://learn.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)

  #### Used by

  - [Office.Group](/javascript/api/office/office.group): [controls](/javascript/api/office/office.group#office-office-group-controls-member)
  - [Office.Tab](/javascript/api/office/office.tab): [controls](/javascript/api/office/office.tab#office-office-tab-controls-member)

  #### Examples

  ```TypeScript
  // This snippet enables a control (a button) in a custom ribbon tab.
  // Note that "MyButton", "OfficeAddinTab1", and "CustomGroup111" are defined in the manifest.
  const enableButton = async () => {
      const button: Control = { id: "MyButton", enabled: true };
      const parentGroup: Group = { id: "CustomGroup111", controls: [button] };
      const parentTab: Tab = { id: "OfficeAddinTab1", groups: [parentGroup] };
      const ribbonUpdater: RibbonUpdaterData = { tabs: [parentTab] };
      Office.ribbon.requestUpdate(ribbonUpdater);
  }
  ```

