### YamlMime:TSType
name: Office.TaskPane
uid: office!Office.TaskPane:interface
package: office!
fullName: Office.TaskPane
summary: Provides methods to manage the task pane of an add-in.
remarks: |-
  **Requirement set**: [TaskPaneApi 1.1](https://learn.microsoft.com/javascript/api/requirement-sets/common/task-pane-api-requirement-sets)

  #### Used by

  - [Office.ExtensionLifeCycle](/javascript/api/office/office.extensionlifecycle): [taskpane](/javascript/api/office/office.extensionlifecycle#office-office-extensionlifecycle-taskpane-member)

  #### Examples

  ```TypeScript
  // Adjust the width of the task pane.
  const width = 500;
  Office.extensionLifeCycle.taskpane.setWidth(width);
  ```

isPreview: false
isDeprecated: false
type: interface
methods:
  - name: setWidth(width)
    uid: office!Office.TaskPane#setWidth:member(1)
    package: office!
    fullName: setWidth(width)
    summary: Sets the width of the task pane of an add-in in pixels.
    remarks: |-
      **Requirement set**: [TaskPaneApi 1.1](https://learn.microsoft.com/javascript/api/requirement-sets/common/task-pane-api-requirement-sets)

      **Important**: The minimum and maximum width constraints vary by platform.

      - **Web (Excel)**: Between 350 and 500 px (inclusive)

      - **Web (Word)**: Between 330 and 500 px (inclusive)

      - **Windows**: Between 86 px and 50% of the client window

      - **Mac**: Between 270 px and 50% of the client window

      The default width of the task pane of an add-in varies depending on the platform.

      - **Web (Excel)**: 350 px

      - **Web (Word)**: 330 px

      - **Windows**: 320 px

      - **Mac**: 270 px

      If you pass a width beyond the minimum and maximum constraints, the task pane isn't resized and no error is shown.

      The `setWidth` method isn't supported in PowerPoint on the web.

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'setWidth(width: number): void;'
      parameters:
        - id: width
          description: The width of a task pane in pixels.
          type: number
      return:
        type: void
        description: ''
