### YamlMime:TSType
name: Office.Group
uid: office!Office.Group:interface
package: office!
fullName: Office.Group
summary: |-
  Represents a group of controls on a ribbon tab.

  **Requirement set**: [RibbonApi 1.1](https://learn.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)
remarks: |-


  #### Used by

  - [Office.Tab](/javascript/api/office/office.tab): [groups](/javascript/api/office/office.tab#office-office-tab-groups-member)

  #### Examples

  ```TypeScript
  /**
   * Shows or hides a contextual tab.
   */
  async function setContextualTabVisibility(visible: boolean) {
      // Define a tab group of controls.
      const group: Office.Group = {
          id: "TableToolsGroup",
          controls: [
              // The controls of the group...
          ],
      };
      
      // Update the ribbon to show or hide a tab with the specified group of controls.
      await Office.ribbon.requestUpdate({
          tabs: [
              {
                  id: "contextTab1",
                  visible: visible,
                  groups: [group],
              },
          ],
      });
  }
  ```

isPreview: false
isDeprecated: false
type: interface
properties:
  - name: controls
    uid: office!Office.Group#controls:member
    package: office!
    fullName: controls
    summary: Specifies one or more of the controls in the group, such as menu items, buttons, etc.
    remarks: When the `Group` object is part of an [Office.RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) object passed to the `requestUpdate` method of [Office.Ribbon](xref:office!Office.Ribbon:interface)<!-- -->, the `controls` properties of the various [Office.Group](xref:office!Office.Group:interface) objects specify which controls have their enabled status changed; the `controls` property of the `Group` object's parent `Tab` object is ignored.

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'controls?: Control[];'
      return:
        type: <xref uid="office!Office.Control:interface" />[]
  - name: id
    uid: office!Office.Group#id:member
    package: office!
    fullName: id
    summary: Identifier of the group as specified in the manifest.
    remarks: ''

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'id: string;'
      return:
        type: string
  - name: visible
    uid: office!Office.Group#visible:member
    package: office!
    fullName: visible
    summary: Specifies whether the group of controls is shown or hidden on a custom tab.
    remarks: |-
      **Requirement set**: [RibbonApi 1.3](https://learn.microsoft.com/javascript/api/requirement-sets/common/ribbon-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Hide the Reporting Group from the User Tools tab on the ribbon.
      const group: Office.Group = {
          id: "Contoso.ReportingGroup",
          visible: visible
      };
      const tab: Office.Tab = {
          id: "Contoso.UserToolsTab",
          groups: [group]
      };
      // Apply the change to the ribbon.
      const ribbonUpdater: Office.RibbonUpdaterData = { tabs: [tab] };
      await Office.ribbon.requestUpdate(ribbonUpdater);
      ```

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'visible?: boolean;'
      return:
        type: boolean
