### YamlMime:TSType
name: Office.AddBindingFromSelectionOptions
uid: office!Office.AddBindingFromSelectionOptions:interface
package: office!
fullName: Office.AddBindingFromSelectionOptions
summary: Provides options for identifying the binding that is created.
remarks: |-


  #### Used by

  - [Office.Bindings](/javascript/api/office/office.bindings): [addFromSelectionAsync](/javascript/api/office/office.bindings#office-office-bindings-addfromselectionasync-member(1))

  #### Examples

  ```TypeScript
  // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/03-bindings/manage-bindings.yaml

  // Creates a text binding from the current selection.
  const options: Office.AddBindingFromSelectionOptions = { id: bindingId };
  Office.context.document.bindings.addFromSelectionAsync(
      Office.BindingType.Text,
      options,
      (asyncResult) => {
          if (asyncResult.status === Office.AsyncResultStatus.Failed) {
              console.error(asyncResult.error.message);
              return;
          }

          console.log(`Created binding "${asyncResult.value.id}" of type "${asyncResult.value.type}".`);
      }
  );
  ```

