### YamlMime:TSType
name: Excel.CellPropertiesLoadOptions
uid: excel!Excel.CellPropertiesLoadOptions:interface
package: excel!
fullName: Excel.CellPropertiesLoadOptions
summary: |-
  Represents which cell properties to load, when used as part of a "range.getCellProperties" method.

  [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
remarks: |-
  #### Used by

  - [Excel.Range](/javascript/api/excel/excel.range): [getCellProperties](/javascript/api/excel/excel.range#excel-excel-range-getcellproperties-member(1))

isPreview: false
isDeprecated: false
type: interface
properties:
  - name: address
    uid: excel!Excel.CellPropertiesLoadOptions#address:member
    package: excel!
    fullName: address
    summary: |-
      Specifies whether to load on the `address` property.

      [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)
    remarks: ''

    isPreview: false
    isDeprecated: false
    syntax:
      content: 'address?: boolean;'
      return:
        type: boolean
        description: |-


          #### Examples

          ```TypeScript
          // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/42-range/cell-properties.yaml

          await Excel.run(async (context) => {
              const cell = context.workbook.getActiveCell();

              // Get only the properties requested in this load-options object.
              const propertiesToGet: Excel.CellPropertiesLoadOptions = {
                  address: true,
                  format: {
                      fill: {
                          color: true
                      },
                      font: {
                          bold: true,
                          color: true
                      }
                  },
                  style: true
              };
              const cellProperties = cell.getCellProperties(propertiesToGet);

              await context.sync();
              console.log(JSON.stringify(cellProperties.value[0][0], null, 2));
          });
          ```
