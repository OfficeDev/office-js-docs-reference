methods:
  - name: add(pageBreakRange)
    uid: excel!Excel.PageBreakCollection#add:member(1)
    package: excel!
    fullName: add(pageBreakRange)
    summary: Adds a page break before the top-left cell of the range specified.
    remarks: |-
      [API set: ExcelApi 1.9](/javascript/api/requirement-sets/excel/excel-api-requirement-sets)

      #### Examples

      ```TypeScript
      // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-page-layout.yaml

      // Add a horizontal page break before the next group of farm sales.
      await Excel.run(async (context) => {
          const farmSheet: Excel.Worksheet = context.workbook.worksheets.getItem("Print");
          const horizontalBreaks: Excel.PageBreakCollection = farmSheet.horizontalPageBreaks;
          horizontalBreaks.add("A21:E21");
          await context.sync();
          console.log("Added a horizontal page break before row 21.");
      });
      ```

    isPreview: false
    isDeprecated: false
